                const totalDif = totalRecibido - totalPedido;
                const cumplimientoGlobal = calcularPorcentaje(totalPedido, totalRecibido);
                
                doc.autoTable({
                    startY: 40,
                    head: [['N Orden', 'Codigo', 'Descripcion', 'Marca', 'Bulto', 'Pedido', 'Recibido', 'Dif.', 'Estado', '%']],
                    body: datosTabla,
                    foot: [['', '', '', '', 'TOTALES', formatearNumero(totalPedido), formatearNumero(totalRecibido), (totalDif > 0 ? '+' : '') + formatearNumero(totalDif), cumplimientoGlobal + '%', '']],

                        fillColor: [79, 70, 229],
                        textColor: 255,
                        fontStyle: 'bold',
                        fontSize: 8
                    },
                    footStyles: {
                        fillColor: [31, 41, 55],
                        textColor: 255,
                        fontStyle: 'bold',
                        fontSize: 9
                    },
                    bodyStyles: {
                        fontSize: 7,
                        cellPadding: 2
                    },
                    columnStyles: {
                        0: { cellWidth: 18 },
                        1: { cellWidth: 18 },
                        2: { cellWidth: 70 },
                        3: { cellWidth: 25 },
                        4: { cellWidth: 12 },
                        5: { cellWidth: 15 },
                        6: { cellWidth: 15 },
                        7: { cellWidth: 15 },
                        8: { cellWidth: 22 },
                        9: { cellWidth: 12 }
                    },
                    didParseCell: function(data) {
                        if (data.section === 'body' && data.column.index === 8) {
                            if (data.cell.text[0] && data.cell.text[0] === 'Completo') {
                                data.row.cells[8].styles.textColor = [6, 95, 70];
                                data.row.cells[8].styles.fillColor = [209, 250, 229];
                                data.row.cells[8].styles.fontStyle = 'bold';
                            } else if (data.cell.text[0] && data.cell.text[0] === 'Faltante') {
                                data.row.cells[8].styles.textColor = [153, 27, 27];
                                data.row.cells[8].styles.fillColor = [254, 226, 226];
                                data.row.cells[8].styles.fontStyle = 'bold';
                            }
                        }
                    }
                });
                
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setTextColor(128);
                    doc.text(`Sistema SAIEP - Control de Ordenes | Pag. ${i} de ${pageCount}`, 148, 200, { align: 'center' });
                }
                
                const nombreArchivo = `orden_${proveedor}_${sucursal}_${new Date().toISOString().split('T')[0]}.pdf`;

                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        <i className="fas fa-store mr-1"></i>Sucursal
                                    </label>
                                    <select className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            value={sucursal} onChange={(e) => setSucursal(e.target.value)} disabled={!zona}>
                                        <option value="">{!zona ? 'Seleccione zona primero' : 'Seleccione sucursal'}</option>
                                        {zona && zonas[zona] && zonas[zona].map(s => (
                                            <option key={s} value={s}>{s}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {proveedor && (
                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Buscar producto</label>
                                    <input type="text" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                           placeholder="Código, descripción o marca..." value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
                                    
                                    {busqueda && (
                                        <div className="mt-2 max-h-60 overflow-y-auto border border-gray-200 rounded-lg">
                                            {productosFiltrados.map(p => (
                                                <div key={p.codigo} className="p-3 hover:bg-gray-50 border-b cursor-pointer flex justify-between items-center"
                                                     onClick={() => agregarProducto(p)}>
                                                    <div>
                                                        <div className="font-medium">{p.codigo} - {p.descripcion}</div>
                                                        <div className="text-sm text-gray-600">{p.marca} | Bulto: {p.bulto} | {p.contenido} {p.unidad}</div>
                                                    </div>
                                                    <button className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Agregar</button>
                                                </div>
                                            ))}
                                            {productosFiltrados.length === 0 && (
                                                <div className="p-4 text-center text-gray-500">No se encontraron productos</div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {productosSeleccionados.length > 0 && (
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <div className="mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-4">
                                        Orden Actual ({productosSeleccionados.length} productos)
                                    </h2>
                                    
                                    {/* Información General - Proveedor, Sucursal y Zona */}
                                    <div className="mb-4 p-4 bg-gradient-to-r from-green-50 to-emerald-50 rounded-lg border-2 border-green-200">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div className="flex items-center space-x-3">
                                                <div className="bg-green-600 rounded-full p-2">
                                                    <i className="fas fa-building text-white"></i>
                                                </div>
                                                <div>
                                                    <div className="text-xs text-green-600 font-medium uppercase">Proveedor</div>
                                                    <div className="text-lg font-bold text-gray-800">{proveedor}</div>
                                                </div>
                                            </div>
                                            
                                            {sucursal && (
                                                <div className="flex items-center space-x-3">
                                                    <div className="bg-blue-600 rounded-full p-2">
                                                        <i className="fas fa-store text-white"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs text-blue-600 font-medium uppercase">Sucursal</div>
                                                        <div className="text-lg font-bold text-gray-800">{sucursal}</div>
                                                    </div>
                                                </div>
                                            )}
                                            
                                            {zona && (
                                                <div className="flex items-center space-x-3">
                                                    <div className="bg-purple-600 rounded-full p-2">
                                                        <i className="fas fa-map-marked-alt text-white"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs text-purple-600 font-medium uppercase">Zona</div>
                                                        <div className="text-lg font-bold text-gray-800">{zona}</div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {/* Resumen de OCs cargadas - Estilo Pills/Badges */}
                                    <div className="mb-6 p-4 bg-gradient-to-r from-indigo-50 to-blue-50 rounded-lg border border-indigo-200">
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-sm font-semibold text-indigo-900 uppercase tracking-wide">
                                                📦 Órdenes de Compra Cargadas
                                            </h3>
                                            <span className="text-xs text-indigo-600 font-medium">
                                                {[...new Set(productosSeleccionados.map(p => p.nroOrden).filter(Boolean))].length} OC{[...new Set(productosSeleccionados.map(p => p.nroOrden).filter(Boolean))].length !== 1 ? 's' : ''}
                                            </span>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {[...new Set(productosSeleccionados.map(p => p.nroOrden).filter(Boolean))].map(orden => {
                                                const cantProductos = productosSeleccionados.filter(p => p.nroOrden === orden).length;
                                                return (
                                                    <div key={orden} className="bg-white border-2 border-indigo-300 rounded-full px-4 py-2 flex items-center space-x-2 shadow-sm hover:shadow-md transition-shadow">
                                                        <span className="text-indigo-600 font-bold text-lg">#{orden}</span>
                                                        <span className="text-gray-400">|</span>
                                                        <span className="text-gray-600 text-sm">{cantProductos} items</span>
                                                    </div>
                                                );
                                            })}
                                            {productosSeleccionados.some(p => !p.nroOrden) && (
                                                <div className="bg-white border-2 border-gray-300 rounded-full px-4 py-2 flex items-center space-x-2 shadow-sm">
                                                    <i className="fas fa-pencil-alt text-gray-500"></i>
                                                    <span className="text-gray-700 text-sm font-medium">
                                                        Manuales ({productosSeleccionados.filter(p => !p.nroOrden).length})
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                    <div className="flex justify-end space-x-2">
                                        <button 
                                            onClick={copiarReporte}
                                            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                                            title="Copiar reporte al portapapeles"
                                        >
                                            📋 Copiar
                                        </button>
                                        <button 
                                            onClick={enviarPorWhatsApp}
                                            className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700"
                                            title="Enviar reporte por WhatsApp"
                                        >
                                            📱 WhatsApp
                                        </button>
                                        <button 
                                            onClick={exportarPDF}
                                            className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700"
                                            title="Exportar a PDF"
                                        >
                                            📄 PDF
                                        </button>
                                        <button 
                                            onClick={exportarXLSX} 
                                            className="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700"
                                            title="Exportar a Excel (.xls)"
                                        >
                                            📊 Excel
                                        </button>
                                        <button 
                                            onClick={exportarODS} 
                                            className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700"
                                            title="Exportar para LibreOffice/OpenOffice (.ods)"
                                        >
                                            📗 LibreOffice
                                        </button>
                                        <button 
                                            onClick={limpiarOrden} 
                                            className="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700"
                                            title="Limpiar toda la orden"
                                        >
                                            🗑️ Limpiar
                                        </button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    {Object.keys(productosAgrupados).map(orden => (
                                        <div key={orden} className="mb-8">
                                            {/* Encabezado de tabla - Estilo profesional con gradiente */}
                                            <div className="bg-gradient-to-r from-indigo-600 to-indigo-700 px-6 py-4 mb-3 rounded-t-lg shadow-md flex items-center justify-between">
                                                <div className="flex items-center space-x-3">
                                                    <i className="fas fa-clipboard-list text-white text-xl"></i>
                                                    <div>
                                                        <h3 className="font-bold text-white text-lg">
                                                            {orden === 'MANUAL' ? 'Productos Agregados Manualmente' : `Orden de Compra N° ${orden}`}
                                                        </h3>
                                                        <p className="text-indigo-200 text-sm">
                                                            {productosAgrupados[orden].length} productos en esta orden
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-indigo-200 text-xs uppercase tracking-wide">Detalle</span>
                                                </div>
                                            </div>
                                            <table className="w-full shadow-lg">
                                                <thead>
                                                    <tr className="bg-indigo-600 text-white">
                                                        <th className="p-2 text-left">Código</th>
                                                        <th className="p-2 text-left">Descripción</th>
                                                        <th className="p-2 text-left">Marca</th>
                                                        <th className="p-2 text-center">Bulto</th>
                                                        <th className="p-2 text-center">Pedido</th>
                                                        <th className="p-2 text-center">Recibido</th>
                                                        <th className="p-2 text-center">Diferencia</th>
                                                        <th className="p-2 text-center">Estado</th>
                                                        <th className="p-2 text-center">%</th>
                                                        <th className="p-2"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {productosAgrupados[orden].map((p) => {
                                                        const dif = calcularDiferencia(p.pedido, p.recibido);
                                                        const pct = calcularPorcentaje(p.pedido, p.recibido);
                                                        const completo = dif >= 0 && pct >= 100;
                                                        const uniqueKey = p.codigo + '-' + (p.nroOrden || 'manual');
                                                        return (
                                                            <tr key={uniqueKey} className={'border-b ' + (completo ? 'bg-green-50' : 'bg-red-50')}>
                                                                <td className="p-2">{p.codigo}</td>
                                                                <td className="p-2">{p.descripcion}</td>
                                                                <td className="p-2">{p.marca}</td>
                                                                <td className="p-2 text-center">{p.bulto}</td>
                                                                <td className="p-2">
                                                                    <input type="number" className="w-20 p-1 border rounded text-center"
                                                                           value={p.pedido} onChange={(e) => actualizarCantidad(p.codigo, p.nroOrden, 'pedido', e.target.value)} />
                                                                </td>
                                                                <td className="p-2">
                                                                    <input type="number" className="w-20 p-1 border rounded text-center"
                                                                           value={p.recibido} onChange={(e) => actualizarCantidad(p.codigo, p.nroOrden, 'recibido', e.target.value)} />
                                                                </td>
                                                                <td className={'p-2 text-center font-bold ' + (dif > 0 ? 'text-green-600' : dif < 0 ? 'text-red-600' : 'text-gray-600')}>
                                                                    {dif > 0 ? '+' : ''}{formatearNumero(dif)}
                                                                </td>
                                                                <td className="p-2 text-center">
                                                                    <span className={'px-2 py-1 rounded ' + (completo ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800')}>
                                                                        {completo ? '✅ Completo' : '❌ Faltante'}
                                                                    </span>
                                                                </td>
                                                                <td className="p-2 text-center font-bold">{pct}%</td>
                                                                <td className="p-2 text-center">
                                                                    <button onClick={() => eliminarProducto(p.codigo, p.nroOrden)} className="text-red-600 hover:text-red-800">❌</button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    ))}
                                    
                                    <div className="mt-4">
                                        <table className="w-full">
                                            <tfoot>
                                                <tr className="bg-gray-800 text-white font-bold">
                                                    <td colSpan="4" className="p-2 text-right">TOTALES:</td>
                                                    <td className="p-2 text-center">{productosSeleccionados.reduce((sum, p) => sum + p.pedido, 0)}</td>
                                                    <td className="p-2 text-center">{productosSeleccionados.reduce((sum, p) => sum + p.recibido, 0)}</td>
                                                    <td className="p-2 text-center">{productosSeleccionados.reduce((sum, p) => sum + calcularDiferencia(p.pedido, p.recibido), 0)}</td>
                                                    <td colSpan="3" className="p-2 text-center">
                                                        {calcularPorcentaje(
                                                            productosSeleccionados.reduce((sum, p) => sum + p.pedido, 0),
                                                            productosSeleccionados.reduce((sum, p) => sum + p.recibido, 0)
                                                        )}% Cumplimiento Global
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {productosSeleccionados.length === 0 && proveedor && sucursal && (
                            <div className="bg-white rounded-lg shadow-lg p-12 text-center">
                                <i className="fas fa-box-open text-6xl text-gray-300 mb-4"></i>
                                <h3 className="text-xl text-gray-600 mb-2">No hay productos en la orden</h3>
                                <p className="text-gray-500">Busca y agrega productos manualmente o carga un CSV</p>
                            </div>
                        )}
                    </div>
                    
                    <footer className="mt-8 pt-6 border-t border-gray-200 text-center text-gray-500">
    <div className="space-y-1 text-xs">
        <div>
            <i className="fas fa-code"></i> Desarrollado por <strong>Jonathan Cheves</strong> 
            <span className="mx-2">|</span>
            <a href="mailto:jcheves@laanonima.com.ar" className="text-blue-600 hover:text-blue-800">
                <i className="fas fa-envelope"></i> jcheves@laanonima.com.ar
            </a>
        </div>
        <div>
            <i className="fas fa-building"></i> SAIEP - De Neuquén Ciudad para Región Centro
        </div>
        <div className="text-gray-400">
            <i className="fas fa-copyright"></i> 2026 - Todos los derechos reservados
        </div>
    </div>
</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
