            {proveedor:"DANONE-MASTELLONE",codigo:"3234381",descripcion:"POSTRE SABOR CHOCOLATE PACK X 4 U",marca:"DANETTE",bulto:18,contenido:380,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"3307669",descripcion:"DULCE DE LECHE CLASICO",marca:"LA SERENISIMA",bulto:8,contenido:1000,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"3346213",descripcion:"DULCE DE LECHE ZERO LACTOSA",marca:"LA SERENISIMA",bulto:12,contenido:300,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"3365402",descripcion:"LECHE EN POLVO ENTERA ESTUCHE",marca:"LA SERENISIMA",bulto:10,contenido:400,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"3417803",descripcion:"QUESO UNTABLE SABOR SALAME",marca:"LA SERENISIMA",bulto:24,contenido:180,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"3436226",descripcion:"DULCE DE LECHE DUBAI",marca:"LA SERENISIMA",bulto:12,contenido:250,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"3461592",descripcion:"DULCE DE LECHE ZERO LACTOSA",marca:"LA SERENISIMA",bulto:12,contenido:250,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"1930473",descripcion:"FORMULA LACTEA POLVO PROFUTURA ET1",marca:"NUTRILON",bulto:12,contenido:800,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"1930485",descripcion:"FORMULA LACTEA POLVO PROFUTURA ET2",marca:"NUTRILON",bulto:12,contenido:800,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"2000192",descripcion:"LECHE MODIF EN POLVO PRO FUTURA E4",marca:"NUTRILON",bulto:12,contenido:800,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"2760691",descripcion:"LECHE MODIFICADA EN POLVO 3",marca:"VITAL",bulto:12,contenido:800,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"2760708",descripcion:"LECHE MODIFICADA EN POLVO 2",marca:"VITAL",bulto:12,contenido:800,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"2990453",descripcion:"FORMULA LACTEA EN POLVO ETAPA 1",marca:"VITAL",bulto:12,contenido:800,unidad:"GR"},
            {proveedor:"DANONE-MASTELLONE",codigo:"3216020",descripcion:"LECHE LV MODIFICADA ETAPA 4",marca:"VITAL",bulto:24,contenido:200,unidad:"CM3"}
        ];

        var PROVEEDORES = ["QUILMES","CCU","COCA COLA","DANONE-MASTELLONE"];
        var SUCURSALES = ["006","068","162","225","226","229","232","233","235","236","237","239","240","248"];

        function App() {
            var s = useState(""); var proveedor = s[0]; var setProveedor = s[1];
            var s2 = useState(""); var sucursal = s2[0]; var setSucursal = s2[1];
            var s3 = useState([]); var seleccionados = s3[0]; var setSeleccionados = s3[1];
            var s4 = useState(""); var busqueda = s4[0]; var setBusqueda = s4[1];

            var filtrados = PRODUCTOS.filter(function(p) {
                return p.proveedor === proveedor &&
                    (p.descripcion.toLowerCase().indexOf(busqueda.toLowerCase()) >= 0 ||
                     p.codigo.indexOf(busqueda) >= 0 ||
                     p.marca.toLowerCase().indexOf(busqueda.toLowerCase()) >= 0);
            });

            function agregar(prod) {
                if (!proveedor || !sucursal) { alert("Seleccione proveedor y sucursal"); return; }
                if (seleccionados.find(function(p){ return p.codigo === prod.codigo; })) { alert("Producto ya agregado"); return; }
                setSeleccionados(seleccionados.concat([Object.assign({}, prod, {pedido:0, recibido:0})]));
            }

            function actualizar(codigo, campo, valor) {
                setSeleccionados(seleccionados.map(function(p) {
                    return p.codigo === codigo ? Object.assign({}, p, {[campo]: parseInt(valor)||0}) : p;
                }));
            }

            function eliminar(codigo) {
                setSeleccionados(seleccionados.filter(function(p){ return p.codigo !== codigo; }));
            }

            function diferencia(pedido, recibido) { return recibido - pedido; }
            function porcentaje(pedido, recibido) { if (pedido === 0) return 100; return Math.round((recibido/pedido)*100); }

            function exportarExcel() {
                var html = "<html><head><meta charset='UTF-8'><style>th{background:#4F46E5;color:white;padding:8px}.completo{background:#D1FAE5}.faltante{background:#FEE2E2}.total{background:#1F2937;color:white}td{border:1px solid #ccc;padding:8px}table{border-collapse:collapse;width:100%}</style></head><body><table>";
                html += "<tr><td colspan='9' style='background:#4F46E5;color:white;font-weight:bold;text-align:center'>Control de Ordenes de Compra</td></tr>";
                html += "<tr><td colspan='9'>Proveedor: " + proveedor + " | Sucursal: " + sucursal + "</td></tr>";
                html += "<tr><th>Codigo</th><th>Descripcion</th><th>Marca</th><th>Bulto</th><th>Pedido</th><th>Recibido</th><th>Diferencia</th><th>Estado</th><th>%</th></tr>";
                seleccionados.forEach(function(p) {
                    var dif = diferencia(p.pedido, p.recibido);
                    var pct = porcentaje(p.pedido, p.recibido);
                    html += "<tr class='" + (dif >= 0 ? "completo" : "faltante") + "'>";
                    html += "<td>" + p.codigo + "</td><td>" + p.descripcion + "</td><td>" + p.marca + "</td><td>" + p.bulto + "</td><td>" + p.pedido + "</td><td>" + p.recibido + "</td><td>" + (dif > 0 ? "+" : "") + dif + "</td><td>" + (dif >= 0 ? "Completo" : "Faltante") + "</td><td>" + pct + "%</td></tr>";
                });
                var totPed = seleccionados.reduce(function(s,p){return s+p.pedido;},0);
                var totRec = seleccionados.reduce(function(s,p){return s+p.recibido;},0);
                html += "<tr class='total'><td colspan='4'>TOTALES</td><td>" + totPed + "</td><td>" + totRec + "</td><td>" + (totRec-totPed) + "</td><td colspan='2'>" + porcentaje(totPed,totRec) + "% Cumplimiento</td></tr>";
                html += "</table></body></html>";
                var blob = new Blob([html], {type:"application/vnd.ms-excel"});
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url;
                a.download = "orden_" + proveedor + "_" + sucursal + ".xls";
                a.click();
            }

            var totPedido = seleccionados.reduce(function(s,p){return s+p.pedido;},0);
            var totRecibido = seleccionados.reduce(function(s,p){return s+p.recibido;},0);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <h1 className="text-3xl font-bold text-indigo-700 mb-6">Control de Ordenes de Compra</h1>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Proveedor</label>
                                    <select className="w-full p-2 border border-gray-300 rounded-lg" value={proveedor} onChange={function(e){setProveedor(e.target.value); setBusqueda("");}}>
                                        <option value="">Seleccione proveedor...</option>
                                        {PROVEEDORES.map(function(p){ return <option key={p} value={p}>{p}</option>; })}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Sucursal</label>
                                    <select className="w-full p-2 border border-gray-300 rounded-lg" value={sucursal} onChange={function(e){setSucursal(e.target.value);}}>
                                        <option value="">Seleccione sucursal...</option>
                                        {SUCURSALES.map(function(s){ return <option key={s} value={s}>{s}</option>; })}
                                    </select>
                                </div>
                            </div>
                            {proveedor && (
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Buscar producto</label>
                                    <input className="w-full p-2 border border-gray-300 rounded-lg" placeholder="Codigo, descripcion o marca..." value={busqueda} onChange={function(e){setBusqueda(e.target.value);}} />
                                    {busqueda && (
                                        <div className="mt-2 max-h-64 overflow-y-auto border border-gray-200 rounded-lg shadow">
                                            {filtrados.length === 0 && <div className="p-3 text-gray-500">Sin resultados</div>}
                                            {filtrados.map(function(p) {
                                                return (
                                                    <div key={p.codigo} className="p-3 hover:bg-indigo-50 border-b cursor-pointer flex justify-between items-center" onClick={function(){agregar(p);}}>
                                                        <div>
                                                            <div className="font-semibold text-gray-800">{p.codigo} - {p.descripcion}</div>
                                                            <div className="text-sm text-gray-500">{p.marca} | Bulto: {p.bulto} | {p.contenido} {p.unidad}</div>
                                                        </div>
                                                        <span className="ml-4 px-3 py-1 bg-indigo-600 text-white rounded-lg text-sm">+ Agregar</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {seleccionados.length > 0 && (
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800">Orden Actual - {proveedor} | Suc. {sucursal}</h2>
                                    <div className="flex gap-2">
                                        <button onClick={exportarExcel} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">Exportar Excel</button>
                                        <button onClick={function(){if(confirm("Limpiar toda la orden?")){setSeleccionados([]);}}} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-semibold">Limpiar</button>
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead>
                                            <tr className="bg-indigo-600 text-white">
                                                <th className="p-2 text-left">Codigo</th>
                                                <th className="p-2 text-left">Descripcion</th>
                                                <th className="p-2 text-left">Marca</th>
                                                <th className="p-2 text-center">Bulto</th>
                                                <th className="p-2 text-center">Pedido</th>
                                                <th className="p-2 text-center">Recibido</th>
                                                <th className="p-2 text-center">Dif.</th>
                                                <th className="p-2 text-center">Estado</th>
                                                <th className="p-2 text-center">%</th>
                                                <th className="p-2"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {seleccionados.map(function(p) {
                                                var dif = diferencia(p.pedido, p.recibido);
                                                var pct = porcentaje(p.pedido, p.recibido);
                                                var ok = dif >= 0;
                                                return (
                                                    <tr key={p.codigo} className={"border-b " + (ok ? "bg-green-50" : "bg-red-50")}>
                                                        <td className="p-2">{p.codigo}</td>
                                                        <td className="p-2">{p.descripcion}</td>
                                                        <td className="p-2">{p.marca}</td>
                                                        <td className="p-2 text-center">{p.bulto}</td>
                                                        <td className="p-2 text-center"><input type="number" className="w-16 p-1 border rounded text-center" value={p.pedido} onChange={function(e){actualizar(p.codigo,"pedido",e.target.value);}} /></td>
                                                        <td className="p-2 text-center"><input type="number" className="w-16 p-1 border rounded text-center" value={p.recibido} onChange={function(e){actualizar(p.codigo,"recibido",e.target.value);}} /></td>
                                                        <td className={"p-2 text-center font-bold " + (dif > 0 ? "text-green-600" : dif < 0 ? "text-red-600" : "text-gray-600")}>{dif > 0 ? "+" : ""}{dif}</td>
                                                        <td className="p-2 text-center"><span className={"px-2 py-1 rounded text-xs font-bold " + (ok ? "bg-green-200 text-green-800" : "bg-red-200 text-red-800")}>{ok ? "Completo" : "Faltante"}</span></td>
                                                        <td className="p-2 text-center font-bold">{pct}%</td>
                                                        <td className="p-2 text-center"><button onClick={function(){eliminar(p.codigo);}} className="text-red-500 hover:text-red-700 font-bold">X</button></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                        <tfoot>
                                            <tr className="bg-gray-800 text-white font-bold">
                                                <td colSpan="4" className="p-2 text-right">TOTALES:</td>
                                                <td className="p-2 text-center">{totPedido}</td>
                                                <td className="p-2 text-center">{totRecibido}</td>
                                                <td className="p-2 text-center">{totRecibido - totPedido}</td>
                                                <td colSpan="3" className="p-2 text-center">{porcentaje(totPedido, totRecibido)}% Cumplimiento Global</td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    <footer className="mt-10 pt-6 border-t border-gray-300 text-center text-gray-500 text-sm">
                        <div className="space-y-1">
                            <div><i className="fas fa-code mr-1"></i> Desarrollado por <strong>Jonathan Cheves</strong></div>
                            <div><i className="fas fa-building mr-1"></i> Sucursales de Neuquen Ciudad | <strong>SAIEP S.A.</strong></div>
                            <div><i className="fas fa-copyright mr-1"></i> 2024 SAIEP S.A. - Todos los derechos reservados</div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("app")).render(<App />);
    </script>
</body>
</html>
